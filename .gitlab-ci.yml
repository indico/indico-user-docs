stages:
  - pages

pages:
  image: registry.cern.ch/docker.io/library/python:3.15-alpine
  stage: pages
  script:
    - apk add --no-cache uv
    - uv sync --locked
    - uv run zensical build
  pages:
    publish: site
  artifacts:
    paths:
      - site
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "cern"'
      when: always
